name: Weekly release
on:
    schedule:
        - cron: "17 8 * * 1"
    workflow_dispatch:

concurrency:
    group: weekly-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    plan:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.plan.outputs.tag }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
            - id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  latest=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""')
                  tag=$(release/plan "$GITHUB_SHA" "$latest")
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "Release: ${tag:-skip (no new commit or already released today)}" >> "$GITHUB_STEP_SUMMARY"

    linux:
        needs: plan
        if: needs.plan.outputs.tag != ''
        uses: ./.github/workflows/kde.yml
        with:
            tag: ${{ needs.plan.outputs.tag }}
            upload: true

    windows:
        needs: plan
        if: needs.plan.outputs.tag != ''
        runs-on: windows-latest
        env:
            TAG: ${{ needs.plan.outputs.tag }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Test, build and archive the x64 executable
              shell: pwsh
              run: |
                  $PSNativeCommandUseErrorActionPreference = $true
                  cargo test --locked -p drink-core -p drink-windows
                  $env:DRINK_RELEASE_VERSION = $env:TAG.Substring(1)
                  windows/build.ps1
                  # Archive with the same bsdtar that the updater extracts with.
                  $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
                  & $tar -a -cf Drink-Windows-x64.zip -C target/windows/x64 Drink.exe
                  if ((& $tar -tf Drink-Windows-x64.zip) -ne 'Drink.exe') { throw 'Unexpected archive contents' }
            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: windows-release
                  path: Drink-Windows-x64.zip
                  if-no-files-found: error

    publish:
        needs: [plan, windows, linux]
        if: needs.plan.outputs.tag != ''
        runs-on: macos-latest
        permissions:
            contents: write
        env:
            TAG: ${{ needs.plan.outputs.tag }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
            - run: cargo test --locked -p drink-core
            - name: Build universal app and archive
              run: |
                  DRINK_RELEASE_VERSION="${TAG#v}" macos/build
                  macos/tests/release-update
                  codesign --verify --strict target/Drink.app
                  archs=$(lipo -archs target/Drink.app/Contents/MacOS/Drink)
                  for arch in x86_64 arm64; do grep -qw "$arch" <<< "$archs"; done
                  ditto -c -k --keepParent target/Drink.app Drink-macOS.zip
            - uses: actions/download-artifact@v8.0.2
              with:
                  name: windows-release
            - uses: actions/download-artifact@v8.0.2
              with:
                  name: linux-release
            - name: Sign and verify the release assets
              env:
                  SIGNING_KEY: ${{ secrets.DRINK_RELEASE_SIGNING_KEY }}
              run: |
                  umask 077
                  key=$(mktemp)
                  trap 'rm -f "$key"' EXIT
                  printf '%s\n' "$SIGNING_KEY" > "$key"
                  unset SIGNING_KEY
                  windows=drink-windows-x64-${TAG#v}
                  linux=drink-linux-kde-x86_64-${TAG#v}
                  ssh-keygen -Y sign -f "$key" -n drink-macos Drink-macOS.zip
                  ssh-keygen -Y sign -f "$key" -n "$windows" Drink-Windows-x64.zip
                  ssh-keygen -Y sign -f "$key" -n "$linux" Drink-Linux-KDE-x86_64.AppImage
                  ssh-keygen -Y verify -f macos/release-signers -I drink -n drink-macos -s Drink-macOS.zip.sig < Drink-macOS.zip
                  ssh-keygen -Y verify -f macos/release-signers -I drink -n "$windows" -s Drink-Windows-x64.zip.sig < Drink-Windows-x64.zip
                  ssh-keygen -Y verify -f macos/release-signers -I drink -n "$linux" -s Drink-Linux-KDE-x86_64.AppImage.sig < Drink-Linux-KDE-x86_64.AppImage
            - name: Publish all assets together
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  assets=(Drink-macOS.zip Drink-macOS.zip.sig Drink-Windows-x64.zip Drink-Windows-x64.zip.sig
                          Drink-Linux-KDE-x86_64.AppImage Drink-Linux-KDE-x86_64.AppImage.sig)
                  if gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish] | @tsv' > "$RUNNER_TEMP/existing"; then
                      read -r draft target < "$RUNNER_TEMP/existing"
                      [[ "$draft" == true && "$target" == "$GITHUB_SHA" ]] || exit 1
                      gh release upload "$TAG" "${assets[@]}" --clobber
                      gh release edit "$TAG" --draft=false --latest
                  else
                      gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Drink ${TAG#v}" --generate-notes --latest
                  fi
