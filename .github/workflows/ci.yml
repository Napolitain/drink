name: CI

on:
    push:
        branches: [main]
    pull_request:

env:
    CARGO_TERM_COLOR: always

jobs:
    nix:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
            - run: nix flake check --no-update-lock-file --print-build-logs

    ci:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7.0.1

            - run: release/test-plan

            # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
            - run: rustup show active-toolchain

            - uses: Swatinem/rust-cache@v2.9.2

            - uses: taiki-e/install-action@v2.87.22
              with:
                  tool: cargo-llvm-cov

            - name: Select the template's clang-format 21
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-format-21
                  mkdir -p "$RUNNER_TEMP/format-bin"
                  ln -s /usr/bin/clang-format-21 "$RUNNER_TEMP/format-bin/clang-format"
                  echo "$RUNNER_TEMP/format-bin" >> "$GITHUB_PATH"

            - name: Hooks (pre-commit)
              uses: j178/prek-action@v3.0.0

            # Includes cargo llvm-cov (tests + coverage gate).
            - name: Hooks (pre-push)
              run: prek run --show-diff-on-failure --all-files --hook-stage pre-push

    kde:
        uses: ./.github/workflows/kde.yml
        with:
            tag: v2000.01.01

    core:
        strategy:
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7.0.1
            - run: rustup show active-toolchain
            - run: cargo test --locked -p drink-core
            - run: cargo build --locked --release -p drink-core
            - if: runner.os == 'macOS'
              run: |
                  macos/build
                  macos/tests/release-update "target/Drink Dev.app"
            # Linux CI lints only the portable modules of the Windows adapter.
            - if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $PSNativeCommandUseErrorActionPreference = $true
                  cargo clippy --locked -p drink-windows --all-targets --all-features -- -D warnings
                  cargo test --locked -p drink-windows
                  windows/build.ps1
