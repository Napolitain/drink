context.spa-libs = { audiotestsrc = audiotestsrc/libspa-audiotestsrc }
context.objects = [
    { factory = adapter args = {
        factory.name = audiotestsrc node.name = test-mic media.class = Audio/Source
        node.param.PortConfig = { direction = Output mode = dsp format = { mediaType = audio mediaSubtype = raw format = F32P rate = 48000 channels = 2 position = [ FL FR ] } }
        audio.channels = 2 audio.position = [ FL FR ]
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = test-call media.class = Stream/Input/Audio
        audio.channels = 2 audio.position = [ FL FR ] adapter.auto-port-config = { mode = dsp position = aux }
    } }
]
