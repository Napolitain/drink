[package]
name = "drink-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native Windows 11 tray adapter for the Drink water-break reminder."
publish = false

[[bin]]
name = "drink"
path = "src/main.rs"

[lints.rust]
# Win32 calls are unsafe. Only the modules that wrap them may opt in.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
unwrap_used = "warn"
expect_used = "warn"
cognitive_complexity = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
drink-core = { path = ".." }

[target.'cfg(windows)'.dependencies]
# COM callbacks use windows::core::implement, which expands to windows_core paths.
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
proptest = "1.11"
